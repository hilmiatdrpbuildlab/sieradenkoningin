# CI (P0-04).
# On pull requests and pushes to main: install → lint → check → unit tests (with a Postgres service)
# → build. On a successful Cloudflare preview deployment: e2e against the preview URL.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  – preview deploys (wrangler)
#   NEON_API_KEY, NEON_PROJECT_ID                 – create a Neon branch per preview (P0-05)
#   PREVIEW_DATABASE_URL                          – optional fixed preview DB if Neon branching is not used
#   E2E_ADMIN_EMAIL, E2E_ADMIN_PASSWORD, E2E_ADMIN_TOTP_SECRET – admin used by e2e against previews
# Optional: SENTRY_AUTH_TOKEN (source maps, P5-04).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  deployment_status:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sk
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: sieradenkoningin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sk" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://sk@localhost:5432/sieradenkoningin_test
      TEST_DATABASE_URL: postgres://sk@localhost:5432/sieradenkoningin_test
      TOTP_ENC_KEY: ${{ secrets.CI_TOTP_ENC_KEY || 'MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=' }}
      SESSION_SECRET: ci-session-secret
      CRON_SECRET: ci-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx svelte-kit sync
      - name: Lint
        run: npm run lint
      - name: Type check (svelte-check, 0 errors / 0 warnings)
        run: npm run check
      - name: Migrate test database
        run: npm run db:migrate
      - name: Unit tests
        run: npm run test
      - name: Build (adapter-cloudflare)
        run: npm run build

  e2e-local:
    # Full e2e suite against a local production build (mock adapters, seeded DB).
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sk
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: sieradenkoningin
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sk" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://sk@localhost:5432/sieradenkoningin
      TOTP_ENC_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      SESSION_SECRET: ci-session-secret
      CRON_SECRET: ci-cron-secret
      PUBLIC_SITE_URL: http://localhost:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run db:migrate && npm run db:seed
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  e2e-preview:
    # Runs when Cloudflare reports a successful preview deployment.
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: ${{ github.event.deployment_status.environment_url }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_ADMIN_TOTP_SECRET: ${{ secrets.E2E_ADMIN_TOTP_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
